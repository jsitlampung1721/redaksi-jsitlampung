<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Berita & Pers Organisasi - JSIT Lampung</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      padding-bottom: 50px;
    }

    /* NAVBAR HEADER */
    .navbar {
      background-color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      border-bottom: 2px solid #f59e0b;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: bold;
      font-size: 1.1rem;
      color: #fff;
    }

    .brand i {
      color: #f59e0b;
    }

    .nav-menu {
      display: flex;
      gap: 20px;
      list-style: none;
    }

    .nav-menu a {
      color: #cbd5e1;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.3s;
    }

    .nav-menu a:hover, .nav-menu a.active {
      color: #f59e0b;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* SEARCH BOX MELEBAR */
    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input {
      width: 0;
      padding: 0;
      border: none;
      outline: none;
      background-color: #334155;
      color: #fff;
      border-radius: 20px;
      font-size: 0.9rem;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0;
    }

    .search-box.active .search-input {
      width: 200px;
      padding: 8px 16px;
      padding-right: 36px;
      opacity: 1;
    }

    .search-btn, .icon-login-btn {
      background-color: #f59e0b;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      transition: transform 0.2s, background-color 0.2s;
    }

    .search-box.active .search-btn {
      position: absolute;
      right: 2px;
      background: transparent;
      color: #f59e0b;
      width: 32px;
      height: 32px;
    }

    .search-btn:hover, .icon-login-btn:hover {
      background-color: #fbbf24;
      transform: scale(1.05);
    }

    /* TICKER TERKINI */
    .ticker-container {
      background-color: #1e293b;
      margin: 15px auto;
      max-width: 1200px;
      display: flex;
      align-items: center;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #334155;
    }

    .ticker-badge {
      background-color: #dc2626;
      color: #fff;
      padding: 10px 16px;
      font-weight: bold;
      font-size: 0.85rem;
      letter-spacing: 1px;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ticker-scroll {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      padding: 8px 0;
    }

    .ticker-text {
      display: inline-block;
      animation: ticker 25s linear infinite;
    }

    .ticker-text a {
      color: #e2e8f0;
      text-decoration: none;
      margin-right: 40px;
      font-size: 0.9rem;
    }

    .ticker-text a:hover {
      color: #f59e0b;
    }

    @keyframes ticker {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    /* HERO SLIDER MODERN */
    .hero-container {
      max-width: 1200px;
      margin: 0 auto 30px auto;
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      height: 420px;
      background-color: #1e293b;
    }

    .slide-wrapper {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .slide {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
      display: flex;
      align-items: flex-end;
    }

    .slide.active {
      opacity: 1;
    }

    .slide-bg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      filter: brightness(0.55);
    }

    .slide-content {
      position: relative;
      z-index: 2;
      padding: 40px;
      max-width: 700px;
      background: linear-gradient(to top, rgba(15, 23, 42, 0.95), rgba(15, 23, 42, 0));
      width: 100%;
    }

    .slide-tag {
      background-color: #f59e0b;
      color: #0f172a;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 4px;
      text-transform: uppercase;
      display: inline-block;
      margin-bottom: 12px;
    }

    .slide-title {
      font-size: 1.8rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 10px;
      color: #ffffff;
    }

    .slide-desc {
      color: #cbd5e1;
      font-size: 0.95rem;
      margin-bottom: 16px;
    }

    .slider-controls {
      position: absolute;
      bottom: 20px;
      right: 30px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 15px;
      background: rgba(15, 23, 42, 0.6);
      padding: 8px 16px;
      border-radius: 30px;
      backdrop-filter: blur(4px);
    }

    .pause-btn {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .pause-btn:hover {
      color: #f59e0b;
    }

    .pagination-dots {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 10px;
      height: 10px;
      background-color: rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .dot.active {
      width: 24px;
      border-radius: 10px;
      background-color: #f59e0b;
    }

    /* GRID BERITA OTOMATIS */
    .main-portal {
      max-width: 1200px;
      margin: 0 auto;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-left: 4px solid #f59e0b;
      padding-left: 12px;
    }

    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .news-card {
      background-color: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .news-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    .news-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .news-body {
      padding: 16px;
    }

    .news-meta {
      font-size: 0.75rem;
      color: #f59e0b;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    .news-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #f8fafc;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .news-excerpt {
      font-size: 0.85rem;
      color: #94a3b8;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="navbar">
    <div class="brand">
      <i class="fa-solid fa-feather-pointed"></i>
      <span>Portal Redaksi & Pers</span>
    </div>

    <nav>
      <ul class="nav-menu">
        <li><a href="#" class="active">Home</a></li>
        <li><a href="#">Berita</a></li>
        <li><a href="#">Nasional</a></li>
        <li><a href="#">Wilayah</a></li>
        <li><a href="#">Daerah</a></li>
        <li><a href="#">Opini</a></li>
      </ul>
    </nav>

    <div class="nav-actions">
      <div class="search-box" id="searchBox">
        <input type="text" class="search-input" placeholder="Cari berita..." id="searchInput">
        <button class="search-btn" id="searchBtn" title="Cari">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </div>

      <button class="icon-login-btn" title="Login Portal" onclick="alert('Membuka Halaman Login')">
        <i class="fa-solid fa-right-to-bracket"></i>
      </button>
    </div>
  </header>

  <!-- TERKINI -->
  <div class="ticker-container">
    <div class="ticker-badge">
      <i class="fa-solid fa-bolt"></i> TERKINI
    </div>
    <div class="ticker-scroll">
      <div class="ticker-text" id="tickerText">
        <span>Memuat berita terbaru...</span>
      </div>
    </div>
  </div>

  <!-- HERO SLIDER -->
  <section class="hero-container">
    <div class="slide-wrapper" id="slideWrapper">
      <!-- Slide berita otomatis dari API dimasukkan di sini -->
    </div>

    <div class="slider-controls">
      <button class="pause-btn" id="pauseBtn" title="Pause / Play">
        <i class="fa-solid fa-pause"></i>
      </button>
      <div class="pagination-dots" id="dotsContainer"></div>
    </div>
  </section>

  <!-- MAIN NEWS GRID -->
  <main class="main-portal">
    <div class="section-header">
      <h2>Berita Terposting</h2>
    </div>

    <div class="news-grid" id="newsGrid">
      <p style="color: #94a3b8;">Memuat data berita...</p>
    </div>
  </main>

  <script>
    // ==========================================
    // CONFIGURASI API URL BEBAS (SHEET / REST API)
    // ==========================================
    const API_URL = "https://script.google.com/macros/s/AKfycbwp6gqwTkvq84_lzCIM-td6TMew9xDCc2yaYweBxphfWbBJc263dC4DbC9g0HQf580R/exec";

    // SEARCH BOX TOGGLE
    const searchBox = document.getElementById('searchBox');
    const searchBtn = document.getElementById('searchBtn');
    const searchInput = document.getElementById('searchInput');

    searchBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      searchBox.classList.toggle('active');
      if (searchBox.classList.contains('active')) searchInput.focus();
    });

    document.addEventListener('click', (e) => {
      if (!searchBox.contains(e.target)) searchBox.classList.remove('active');
    });

    // SLIDER STATE
    let currentIndex = 0;
    let isPlaying = true;
    let slideInterval;
    let totalSlides = 0;

    // AMBIL DATA DARI API AUTOMATIS
    async function fetchPortalNews() {
      try {
        const response = await fetch(API_URL);
        const articles = await response.json();

        // Filter berita yang sudah disetujui / diposting jika ada flag status
        const publishedNews = articles.filter(item => !item.status || item.status === 'Approved' || item.status === 'Published');

        renderTicker(publishedNews);
        renderHeroSlider(publishedNews.slice(0, 3)); // 3 berita terbaru untuk Hero Slider
        renderNewsGrid(publishedNews);

      } catch (error) {
        console.error("Gagal mengambil berita:", error);
        // Tampilan Fallback jika API URL belum dimasukkan atau error
        renderFallbackData();
      }
    }

    function renderTicker(data) {
      const tickerContainer = document.getElementById('tickerText');
      if (!data.length) return;

      tickerContainer.innerHTML = data.map(item => `
        <a href="${item.link || '#'}">• ${item.title || item.judul}</a>
      `).join('');
    }

    function renderHeroSlider(heroData) {
      const wrapper = document.getElementById('slideWrapper');
      const dotsContainer = document.getElementById('dotsContainer');
      
      wrapper.innerHTML = '';
      dotsContainer.innerHTML = '';
      totalSlides = heroData.length;

      heroData.forEach((item, idx) => {
        const activeClass = idx === 0 ? 'active' : '';
        wrapper.innerHTML += `
          <div class="slide ${activeClass}">
            <img src="${item.image || item.gambar || 'https://images.unsplash.com/photo-1504711434969-e33886168f5c'}" class="slide-bg" alt="Slide">
            <div class="slide-content">
              <span class="slide-tag">${item.category || item.kategori || 'Utama'}</span>
              <h1 class="slide-title">${item.title || item.judul}</h1>
              <p class="slide-desc">${item.excerpt || item.ringkasan || ''}</p>
            </div>
          </div>
        `;

        const dot = document.createElement('div');
        dot.className = `dot ${activeClass}`;
        dot.addEventListener('click', () => goToSlide(idx));
        dotsContainer.appendChild(dot);
      });

      startAutoplay();
    }

    function renderNewsGrid(data) {
      const grid = document.getElementById('newsGrid');
      grid.innerHTML = data.map(item => `
        <article class="news-card">
          <img src="${item.image || item.gambar || 'https://images.unsplash.com/photo-1585829365295-ab7cd400c167'}" class="news-img" alt="Berita">
          <div class="news-body">
            <div class="news-meta">
              <span>${item.category || item.kategori || 'BERITA'}</span>
              <span>${item.date || item.tanggal || ''}</span>
            </div>
            <h3 class="news-title">${item.title || item.judul}</h3>
            <p class="news-excerpt">${item.excerpt || item.ringkasan || ''}</p>
          </div>
        </article>
      `).join('');
    }

    // CONTROLLER SLIDER
    function goToSlide(index) {
      const slides = document.querySelectorAll('.slide');
      const dots = document.querySelectorAll('.dot');
      if (!slides.length) return;

      slides[currentIndex].classList.remove('active');
      dots[currentIndex].classList.remove('active');
      currentIndex = index;
      slides[currentIndex].classList.add('active');
      dots[currentIndex].classList.add('active');
    }

    function nextSlide() {
      if (totalSlides === 0) return;
      const nextIndex = (currentIndex + 1) % totalSlides;
      goToSlide(nextIndex);
    }

    function startAutoplay() {
      clearInterval(slideInterval);
      slideInterval = setInterval(nextSlide, 4000);
    }

    document.getElementById('pauseBtn').addEventListener('click', function() {
      if (isPlaying) {
        clearInterval(slideInterval);
        this.innerHTML = '<i class="fa-solid fa-play"></i>';
      } else {
        startAutoplay();
        this.innerHTML = '<i class="fa-solid fa-pause"></i>';
      }
      isPlaying = !isPlaying;
    });

    // DEMO FALLBACK (JIKA API BELUM TERHUBUNG)
    function renderFallbackData() {
      const sample = [
        { title: "Rapat Kerja Wilayah JSIT Lampung Menetapkan Program 2026", category: "WILAYAH", date: "30 Sep 2026", excerpt: "Rencana strategis penguatan sistem literasi digital sekolah terpadu..." },
        { title: "Pelatihan Jurnalistik Sekolah Menuju Era Digital", category: "PENDIDIKAN", date: "29 Sep 2026", excerpt: "Siswa diajarkan etika jurnalistik dan penulisan berita pers yang valid..." },
        { title: "Opini: Tantangan Pendidikan Islam Terpadu Masa Depan", category: "OPINI", date: "28 Sep 2026", excerpt: "Mempertahankan nilai akhlak di tengah derasnya arus informasi kecerdasan buatan..." }
      ];
      renderTicker(sample);
      renderHeroSlider(sample);
      renderNewsGrid(sample);
    }

    // JALANKAN PEMANGGILAN API
    fetchPortalNews();
  </script>
</body>
</html>
